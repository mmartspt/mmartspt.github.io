<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada — MM Arts</title>
<link rel="icon" href="/assets/images/favicon.png">
<style>
  :root{--forest:#0d3a24;--blue:#3a45d6;--paper:#f7faf4;--mint:#dfecd6;--ink:#1a2b22;--soft:#4a5d52;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;background:var(--mint);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;}
  main{max-width:520px;background:var(--paper);border:1px solid rgba(13,58,36,.18);border-radius:22px;padding:2.4rem 1.6rem 2.2rem;box-shadow:0 10px 30px rgba(13,58,36,.08);}
  img.logo{height:52px;width:auto;margin-bottom:1.2rem}
  .code{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(3.4rem,16vw,5.2rem);line-height:1;color:var(--forest);margin:0}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:1.5rem;margin:.6rem 0 .5rem;color:var(--forest)}
  p{margin:.3rem 0;color:var(--soft);line-height:1.55}
  .en{font-size:.92rem;opacity:.85}
  a.btn{display:inline-block;margin-top:1.4rem;padding:.85rem 1.6rem;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;letter-spacing:.02em}
  a.btn:hover{filter:brightness(1.08)}
  a.btn:focus-visible{outline:3px solid var(--forest);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/images/logo.png" alt="MM Arts">
  <p class="code">404</p>
  <h1>Esta página não existe</h1>
  <p>O endereço pode estar errado ou a página foi movida.</p>
  <p class="en">This page does not exist. The address may be wrong or the page has moved.</p>
  <a class="btn" href="/">Voltar ao início · Back to home</a>
</main>
</body>
</html>
